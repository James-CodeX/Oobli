name: oobli
description: "Oobli — AI spending & planning for Kenya"
publish_to: 'none'

version: 1.6.1+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  appwrite: 28.0.0
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  share_plus: ^13.3.1
  crypto: ^3.0.8
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  connectivity_plus: ^7.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/branding/logo.png
    - assets/mascot/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-400.ttf
          weight: 400
        - asset: assets/fonts/Poppins-500.ttf
          weight: 500
        - asset: assets/fonts/Poppins-600.ttf
          weight: 600
        - asset: assets/fonts/Poppins-700.ttf
          weight: 700
        - asset: assets/fonts/Poppins-800.ttf
          weight: 800
