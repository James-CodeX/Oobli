# Native launch screen matching the system theme: `dart run flutter_native_splash:create`
flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#131F24"
  image: assets/branding/splash.png
  image_dark: assets/branding/splash.png
  android_12:
    image: assets/branding/splash_android12.png
    image_dark: assets/branding/splash_android12.png
    color: "#FFFFFF"
    color_dark: "#131F24"
  android: true
  ios: true
  web: false
  fullscreen: false
