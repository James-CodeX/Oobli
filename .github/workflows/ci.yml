name: CI

# Skipped when a change only touches the website or docs: there is no app
# code to check.
on:
  push:
    branches: [main]
    paths-ignore: ['web/**', 'docs/**', '**/*.md', 'LICENSE', '.github/readme/**', '.github/workflows/web.yml']
  pull_request:
    paths-ignore: ['web/**', 'docs/**', '**/*.md', 'LICENSE', '.github/readme/**', '.github/workflows/web.yml']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Analyze & test app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      # Golden (pixel snapshot) tests depend on the host renderer; run them locally.
      - run: flutter test --exclude-tags golden

  function:
    name: Test AI function
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions/oobli-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
