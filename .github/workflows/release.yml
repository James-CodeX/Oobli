name: Release

# Push a version tag to build signed Android packages and publish a GitHub Release:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    name: Build & publish Android release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing; refusing to publish a debug-signed release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      - name: Resolve version
        id: version
        run: |
          echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --exclude-tags golden

      - name: Build APKs and App Bundle
        run: |
          ARGS="--release --build-name=${{ steps.version.outputs.name }} --build-number=${{ steps.version.outputs.code }}"
          flutter build apk $ARGS
          flutter build apk $ARGS --split-per-abi
          flutter build appbundle $ARGS

      - name: Collect artifacts
        run: |
          V=${{ steps.version.outputs.name }}
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/oobli-$V-universal.apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "dist/oobli-$V-$abi.apk"
          done
          cp build/app/outputs/bundle/release/app-release.aab "dist/oobli-$V.aab"
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -la dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Oobli ${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: dist/*
          body: |
            ## Install on Android
            - **Most phones:** download `oobli-${{ steps.version.outputs.name }}-arm64-v8a.apk`.
            - **Not sure?** `oobli-${{ steps.version.outputs.name }}-universal.apk` works on every device (larger).
            - The `.aab` is for Google Play uploads.

            Open the APK on your phone and allow "Install unknown apps" for your browser or file manager when asked.

      - name: Remove signing material
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties
