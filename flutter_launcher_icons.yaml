# Generates launcher icons from the Oobli logo: `dart run flutter_launcher_icons`
flutter_launcher_icons:
  image_path: assets/branding/logo.png
  android: true
  min_sdk_android: 24
  adaptive_icon_background: "#E3F9EE"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#E3F9EE"
